# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-resilience"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-resilience"
description = "Retry, timeout, circuit breaker, fallback and rate limiting contracts for Xmip."

[lib]
# A host crate: the technologies mount beside this source (ADR-0049).
path = ".src/lib.rs"

[dependencies]
# The one retryable failure a guard judges an attempt by.
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[profile.dev.package."*"]
opt-level = 3
